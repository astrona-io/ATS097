# Encrypt A Secret For Git
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-020-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-020-01-setup"
      description: "Creates a team age key pair: the recipient goes into the ConfigMap sops-recipient (flux-system), the identity into the Secret team-age-key (gitea) for the grader. Nothing is encrypted yet."
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-sops-config"
      description: "Confirms .sops.yaml names the team recipient and encrypts only data and stringData"
      type: "file"
      source: "validation/validate-sops-config.sh"
    - name: "validate-file-encrypted"
      description: "Confirms secrets/podinfo/secret.yaml is encrypted for the team recipient with readable metadata"
      type: "file"
      source: "validation/validate-file-encrypted.sh"
    - name: "validate-team-can-decrypt"
      description: "Confirms the team identity decrypts the file to the expected password"
      type: "file"
      source: "validation/validate-team-can-decrypt.sh"
    - name: "validate-no-identity-in-git"
      description: "Confirms no age identity is committed"
      type: "file"
      source: "validation/validate-no-identity-in-git.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
