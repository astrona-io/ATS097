# Let Flux Decrypt Secrets In The Cluster (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-playground-020-02"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install flux, sops and age, start Gitea, create a team age key (identity in the Secret team-age-key in gitea), commit .sops.yaml and an encrypted podinfo-db Secret, install Flux and apply the Flux objects without decryption."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Starting workloads (namespace gitea, Gitea Deployment and Service gitea-http, tester client)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
