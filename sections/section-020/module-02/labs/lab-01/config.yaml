# Make Flux Decrypt Secrets
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-020-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-020-02-setup"
      description: "Creates a team age key (identity in the Secret team-age-key in gitea), commits .sops.yaml and apps/podinfo/secret.yaml encrypted for it, and applies the Flux Kustomization podinfo without decryption settings."
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-decryption-configured"
      description: "Confirms the Flux Kustomization podinfo decrypts with sops-age, which holds the team identity"
      type: "file"
      source: "validation/validate-decryption-configured.sh"
    - name: "validate-secret-decrypted"
      description: "Confirms the Secret podinfo-db in the cluster holds the decrypted password"
      type: "file"
      source: "validation/validate-secret-decrypted.sh"
    - name: "validate-git-still-encrypted"
      description: "Confirms apps/podinfo/secret.yaml is still encrypted in Git"
      type: "file"
      source: "validation/validate-git-still-encrypted.sh"
    - name: "validate-no-identity-in-git"
      description: "Confirms no age identity is committed"
      type: "file"
      source: "validation/validate-no-identity-in-git.sh"
    - name: "validate-podinfo-running"
      description: "Confirms the Flux Kustomization podinfo is Ready and podinfo runs"
      type: "file"
      source: "validation/validate-podinfo-running.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
