# Rotate A Leaked age Key
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-capstone-020-setup"
      description: "Creates an age key, commits .sops.yaml and an encrypted podinfo-db Secret for it, stores the identity in sops-age so Flux decrypts it, and records the soon-leaked recipient in the ConfigMap capstone-baseline (gitea)."
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-new-recipient-in-git"
      description: "Confirms .sops.yaml and the encrypted file name one new recipient, not the leaked one"
      type: "file"
      source: "validation/validate-new-recipient-in-git.sh"
    - name: "validate-cluster-identity"
      description: "Confirms sops-age holds the new identity and not the leaked one"
      type: "file"
      source: "validation/validate-cluster-identity.sh"
    - name: "validate-value-rotated"
      description: "Confirms the cluster holds the new password and Git holds it only encrypted"
      type: "file"
      source: "validation/validate-value-rotated.sh"
    - name: "validate-no-identity-in-git"
      description: "Confirms no age identity is committed"
      type: "file"
      source: "validation/validate-no-identity-in-git.sh"
    - name: "validate-podinfo-running"
      description: "Confirms the Flux Kustomization podinfo is Ready and podinfo runs"
      type: "file"
      source: "validation/validate-podinfo-running.sh"

teardown:
  keepCluster: false
