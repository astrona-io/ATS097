# Add A Backup Recipient To An Encrypted File
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-020-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-020-03-setup"
      description: "The team encrypted the `podinfo-db` Secret in Git for one age key, and Flux decrypts it with the Secret `sops-age`"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-sops-config"
      description: "Confirms .sops.yaml lists both recipients"
      type: "file"
      source: "validation/validate-sops-config.sh"
    - name: "validate-file-recipients"
      description: "Confirms the encrypted file lists both recipients and is still encrypted"
      type: "file"
      source: "validation/validate-file-recipients.sh"
    - name: "validate-backup-decrypts"
      description: "Confirms the backup identity decrypts the file"
      type: "file"
      source: "validation/validate-backup-decrypts.sh"
    - name: "validate-flux-still-decrypts"
      description: "Confirms the Kustomization podinfo is Ready and the Secret holds the value"
      type: "file"
      source: "validation/validate-flux-still-decrypts.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
