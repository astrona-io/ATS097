# Give Each Tenant Its Own Key
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-020-04"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-020-04-setup"
      description: "Two tenants have their own folders in Git, `tenants/a` and `tenants/b`, each with a Secret encrypted for the tenant's own age key"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-tenant-b-secret"
      description: "Confirms tenant-b uses its own decryption Secret holding the identity of tenant b"
      type: "file"
      source: "validation/validate-tenant-b-secret.sh"
    - name: "validate-shared-key-not-widened"
      description: "Confirms sops-age still holds only the identity of tenant a"
      type: "file"
      source: "validation/validate-shared-key-not-widened.sh"
    - name: "validate-tenants-ready"
      description: "Confirms both Kustomizations are Ready and both Secrets hold their values"
      type: "file"
      source: "validation/validate-tenants-ready.sh"
    - name: "validate-git-encrypted"
      description: "Confirms the tenant files are still encrypted and no identity is in Git"
      type: "file"
      source: "validation/validate-git-encrypted.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
