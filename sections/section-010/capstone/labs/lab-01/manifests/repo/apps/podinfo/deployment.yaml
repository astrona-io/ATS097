apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          env:
            - name: PODINFO_UI_MESSAGE
              value: "deployed by Flux"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: podinfo-db
                  key: password
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: podinfo-api
                  key: token
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: podinfo-settings
                  key: smtp-host
            - name: SMTP_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: podinfo-settings
                  key: smtp-password
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
