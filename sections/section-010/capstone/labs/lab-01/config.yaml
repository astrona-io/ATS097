# Clean Every Credential Out Of The Repository
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-capstone-010-setup"
      description: "Applies the Flux objects. Flux deploys podinfo with three credentials from Git: a Secret in stringData, a Secret in Base64 data, and a password in a ConfigMap."
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-git-clean"
      description: "Confirms gitops/fleet holds no plain Secret, no password in a ConfigMap and none of the new values"
      type: "file"
      source: "validation/validate-git-clean.sh"
    - name: "validate-secrets-rotated"
      description: "Confirms podinfo-db, podinfo-api and podinfo-smtp hold the new values"
      type: "file"
      source: "validation/validate-secrets-rotated.sh"
    - name: "validate-secrets-outside-flux"
      description: "Confirms no Secret is applied from Git any more"
      type: "file"
      source: "validation/validate-secrets-outside-flux.sh"
    - name: "validate-smtp-from-secret"
      description: "Confirms podinfo reads SMTP_PASSWORD from the Secret podinfo-smtp"
      type: "file"
      source: "validation/validate-smtp-from-secret.sh"
    - name: "validate-podinfo-running"
      description: "Confirms the Flux Kustomization podinfo is Ready and podinfo runs"
      type: "file"
      source: "validation/validate-podinfo-running.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
