# Read A Secret From A Store
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-010-03-setup"
      description: "The team will keep the API token of `podinfo` in a secret store and not in Git"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-operator"
      description: "Confirms the HelmRelease external-secrets is Ready and its Deployment is available"
      type: "file"
      source: "validation/validate-operator.sh"
    - name: "validate-externalsecret"
      description: "Confirms the ExternalSecret is Ready and the Secret holds the store value and is owned by it"
      type: "file"
      source: "validation/validate-externalsecret.sh"
    - name: "validate-refresh-interval"
      description: "Confirms the refresh interval is set and not zero"
      type: "file"
      source: "validation/validate-refresh-interval.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
