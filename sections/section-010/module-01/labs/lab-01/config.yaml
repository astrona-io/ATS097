# Remove A Plain Secret From Git
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-010-01-setup"
      description: "Applies the Flux objects. Flux deploys podinfo together with the Secret podinfo-db, whose password is committed in plain text."
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-git-clean"
      description: "Confirms gitops/fleet holds no plain Secret and not the new value"
      type: "file"
      source: "validation/validate-git-clean.sh"
    - name: "validate-secret-rotated"
      description: "Confirms the Secret podinfo-db holds the new password"
      type: "file"
      source: "validation/validate-secret-rotated.sh"
    - name: "validate-secret-outside-flux"
      description: "Confirms the Secret podinfo-db is no longer applied from Git"
      type: "file"
      source: "validation/validate-secret-outside-flux.sh"
    - name: "validate-podinfo-running"
      description: "Confirms the Flux Kustomization podinfo is Ready and podinfo runs"
      type: "file"
      source: "validation/validate-podinfo-running.sh"

teardown:
  keepCluster: false
