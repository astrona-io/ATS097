# Fill A Manifest From A Secret
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-010-04"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-010-04-setup"
      description: "The repository holds the ConfigMap `banner` with the text `${banner_text}`"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-substitutefrom"
      description: "Confirms the Kustomization podinfo lists the Secret cluster-secrets in postBuild.substituteFrom"
      type: "file"
      source: "validation/validate-substitutefrom.sh"
    - name: "validate-configmap-value"
      description: "Confirms the ConfigMap banner holds the value from the Secret"
      type: "file"
      source: "validation/validate-configmap-value.sh"
    - name: "validate-git-keeps-placeholder"
      description: "Confirms banner.yaml on main still holds the placeholder and not the value"
      type: "file"
      source: "validation/validate-git-keeps-placeholder.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
