# Seal A Secret With The Controller
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-010-02-setup"
      description: "The `podinfo` application reads its database password from the Secret `podinfo-db` in the namespace `podinfo`"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-controller"
      description: "Confirms the HelmRelease sealed-secrets is Ready and the controller Deployment is available"
      type: "file"
      source: "validation/validate-controller.sh"
    - name: "validate-secret-from-sealedsecret"
      description: "Confirms the Secret podinfo-db is owned by the SealedSecret and holds sealed-in-lab"
      type: "file"
      source: "validation/validate-secret-from-sealedsecret.sh"
    - name: "validate-sealed-strict"
      description: "Confirms the SealedSecret holds ciphertext and uses the strict scope"
      type: "file"
      source: "validation/validate-sealed-strict.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
