# One Receiver For Many Sources
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-030-04"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-030-04-setup"
      description: "Three sources carry the label `reconcile-on-push=true`: the `GitRepository` objects `fleet` and `fleet-copy`, and the `HelmRepository` `podinfo-charts`"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-receiver-spec"
      description: "Confirms push-receiver selects both kinds by label with the wildcard name"
      type: "file"
      source: "validation/validate-receiver-spec.sh"
    - name: "validate-selected-sources-reconcile"
      description: "Sends a signed request and checks which sources were reconciled"
      type: "file"
      source: "validation/validate-selected-sources-reconcile.sh"
    - name: "validate-labels-and-intervals"
      description: "Confirms fleet-skip is unlabeled and no interval was shortened"
      type: "file"
      source: "validation/validate-labels-and-intervals.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
