# Reconcile On Every Push
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-030-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-030-01-setup"
      description: "Creates podinfo-db outside Git and applies the Flux objects. The GitRepository fleet polls once an hour, and there is no Receiver and no webhook."
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-receiver"
      description: "Confirms the Receiver gitea-receiver is a github Receiver for the GitRepository fleet and is Ready"
      type: "file"
      source: "validation/validate-receiver.sh"
    - name: "validate-gitea-webhook"
      description: "Confirms an active push webhook in gitops/fleet calls the Receiver's webhook path"
      type: "file"
      source: "validation/validate-gitea-webhook.sh"
    - name: "validate-interval-unchanged"
      description: "Confirms the GitRepository fleet still polls every 30 minutes or less often"
      type: "file"
      source: "validation/validate-interval-unchanged.sh"
    - name: "validate-push-reaches-cluster"
      description: "Pushes a commit and confirms source-controller fetches it within a minute"
      type: "file"
      source: "validation/validate-push-reaches-cluster.sh"

teardown:
  keepCluster: false
