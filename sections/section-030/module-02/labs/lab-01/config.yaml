# Make The Receiver Check Signatures
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-097-lab-030-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-git-and-flux"
      description: "Installs flux 2.9.6, sops 3.13.3 and age 1.3.2, Gitea with the repository gitops/fleet, the CoreDNS rewrite and the Flux controllers"
      type: "file"
      source: "bootstrap/01-install-git-and-flux.sh"
    - name: "ats-097-lab-030-02-setup"
      description: "The Receiver `fleet-receiver` in `flux-system` reconciles the `GitRepository` `fleet` when a request reaches its path"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-flux"
      description: "Waits until Gitea and every Flux controller are available"
      type: "file"
      source: "testing/wait-for-flux.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-receiver-type"
      description: "Confirms fleet-receiver is a Ready generic-hmac Receiver for the GitRepository fleet"
      type: "file"
      source: "validation/validate-receiver-type.sh"
    - name: "validate-signed-request"
      description: "Sends a signed, an unsigned and a wrongly signed request and checks the results"
      type: "file"
      source: "validation/validate-signed-request.sh"
    - name: "validate-interval-unchanged"
      description: "Confirms the GitRepository fleet still polls every 30 minutes or less often"
      type: "file"
      source: "validation/validate-interval-unchanged.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.2.0-rootless
      - nicolaka/netshoot:v0.13
