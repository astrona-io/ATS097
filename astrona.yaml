# Course manifest for ATS097 - Secret Management, SOPS & Webhook Receivers (FluxCD).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS097
  title: "FluxCD: Secret Management, SOPS & Webhook Receivers"
  maturity: alpha
  description: >
    Training material covering the Secret Management, SOPS & Webhook
    Receivers domain of the FluxCD training path: why a plain Kubernetes
    Secret cannot go to Git, the options for secrets in GitOps (SOPS, Sealed
    Secrets, External Secrets Operator), encrypting Secrets with SOPS and age,
    decryption by kustomize-controller, rotating a leaked key, key management
    services, and Receivers that make Flux reconcile as soon as Git is pushed.
    Each module pairs a layered reader with an ungraded hands-on playground
    and a graded practice lab. Each section closes with an integration
    capstone.
    Written for Flux v2.9.6, SOPS 3.13.3 and age 1.3.2.

  certification:
    name: FluxCD
    code: FLUX
    provider: Astrona

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

