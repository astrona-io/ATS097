        tags: [sops, age, sops-config, encrypted-regex, age-recipient, kubernetes-secret]
        learning_goals:
          - Write a .sops.yaml creation rule for a team age recipient
          - Encrypt a Kubernetes Secret so only its values are encrypted
          - Commit the encrypted file and prove the team identity decrypts it
        resources:
