# Course manifest for ATS097 - Secret Management, SOPS & Webhook Receivers (FluxCD).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's summary page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS097
  title: "FluxCD: Secret Management, SOPS & Webhook Receivers"
  maturity: draft
  description: >
    Training material covering the Secret Management, SOPS & Webhook
    Receivers domain of the FluxCD training path: why a plain Kubernetes
    Secret cannot go to Git, the options for secrets in GitOps (SOPS, Sealed
    Secrets, External Secrets Operator), encrypting Secrets with SOPS and age,
    decryption by kustomize-controller, rotating a leaked key, key management
    services, and Receivers that make Flux reconcile as soon as Git is pushed.
    Each module pairs a layered reader with an ungraded hands-on playground
    and a graded practice lab. Each section closes with an integration
    capstone.
    Written for Flux v2.9.6, SOPS 3.13.3 and age 1.3.2.

  certification:
    name: FluxCD
    code: FLUX
    provider: Astrona
    domain: Secret Management, SOPS & Webhook Receivers
    weight: 15

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Secrets In GitOps"
    description: >
      Why a Kubernetes Secret in Git is a published password, what Git
      history does to a committed secret, the options for secrets in GitOps
      and when each fits, and how to take a committed secret out of Git and
      rotate it without breaking the application.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Keep Plain Secrets Out Of Git"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Why A Plain Secret Cannot Go To Git"
        path: sections/section-010/module-01/course-01-why-plain-secrets-cannot-go-to-git.md
      - type: reading
        title: "The Options For Secrets In GitOps"
        path: sections/section-010/module-01/course-02-options-for-secrets-in-gitops.md
      - type: reading
        title: "Removing A Secret That Was Committed"
        path: sections/section-010/module-01/course-03-removing-a-committed-secret.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Remove A Plain Secret From Git Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: secrets-in-git
        task_kind: troubleshooting
        tags: [kubernetes-secret, base64, git-history, secret-rotation, prune, kustomization]
        learning_goals:
          - Find a plain Secret in Git and in Git history and read its value
          - Remove the Secret from Git without leaving the application without it
          - Rotate the exposed value and prove the new value is in the cluster and not in Git
        resources:
          - name: "Manage Kubernetes secrets with SOPS"
            url: https://fluxcd.io/flux/guides/mozilla-sops/
          - name: "Kustomization API: prune"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/#prune
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-04-summary.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Clean Every Credential Out Of The Repository Capstone"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: secrets-in-git
        task_kind: troubleshooting
        tags: [kubernetes-secret, base64, git-history, secret-rotation, prune, kustomization]
        learning_goals:
          - Find every credential in a repository, including one in a ConfigMap and one Base64-encoded
          - Remove them from Git while the application keeps running
          - Rotate every exposed value and prove none of the new values is in Git
        resources:
          - name: "Manage Kubernetes secrets with SOPS"
            url: https://fluxcd.io/flux/guides/mozilla-sops/
          - name: "Kustomization API"
            url: https://fluxcd.io/flux/components/kustomize/kustomizations/

